<ion-header class="ion-no-border">
  <ion-toolbar color="secondary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/" ></ion-back-button>
    </ion-buttons>
    <ion-title class="ion-text-center ion-text-capitalize">{{titulo()}}</ion-title>
    <ion-buttons slot="end">
      <ion-menu-toggle menu="primer-menu">
        <ion-avatar>
          <img src="https://img.magnific.com/vector-premium/ilustracion-diseno-icono-vectorial-menu_1174953-35758.jpg?semt=ais_hybrid&w=740&q=80" alt="">
        </ion-avatar>
      </ion-menu-toggle>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
