<ion-menu side="end" contentId="principal"
          menuId="primer-menu">
  <ion-header>
    <ion-toolbar color="secondary">
      <ion-title class="ion-text-center">Mi menú</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-content class="ion-padding">
    <ion-list>
      <ion-menu-toggle>
        <ion-list-header routerLink="/" color="secondary">Inicio</ion-list-header>
      </ion-menu-toggle>
      @for (componente of componentes(); track componente.nombre){
        <ion-menu-toggle>
          <ion-item [routerLink]="componente.ruta">
            <ion-icon color="secondary" [name]="componente.icono" slot="start"></ion-icon>
            <ion-label>{{componente.nombre}}</ion-label>
          </ion-item>
        </ion-menu-toggle>
      }
    </ion-list>
  </ion-content>
</ion-menu>
